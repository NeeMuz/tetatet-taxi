{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<h2 style="text-align:center; margin-bottom: 25px;">Регистрация</h2>

{% if error %}
<p class="error" style="text-align:center; margin-bottom: 15px;">{{ error }}</p>
{% endif %}

<form method="POST" style="display:flex; flex-direction:column; gap:15px;">
    {% csrf_token %}

    <input name="first_name" placeholder="Имя" required>
    <input name="last_name" placeholder="Фамилия" required>
    <input name="email" type="email" placeholder="Email" required>

    <div class="password-wrapper">
        <input id="password" name="password" type="password" placeholder="Пароль" required>
        <button type="button" class="show-password-btn" onclick="togglePassword()">Показать</button>
    </div>

    <button style="margin-top:10px;">Создать аккаунт</button>
</form>

<p style="text-align:center; margin-top:15px;">
    Уже есть аккаунт? <a href="/login/">Войти</a>
</p>

<style>
.password-wrapper {
    position: relative;
}

.password-wrapper input {
    width: 100%;
    padding-right: 90px;
}

.show-password-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    padding: 6px 12px;
    background: #6c63ff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

.show-password-btn:hover {
    background: #584fe0;
}

input {
    padding: 12px;
    border-radius: 6px;
    border: none;
    font-size: 15px;
}

button {
    padding: 12px;
    border-radius: 6px;
    border: none;
    background: #f1c40f;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

button:hover {
    background: #d4ac0d;
}
</style>

<script>
function togglePassword() {
    const input = document.getElementById("password");
    const btn = document.querySelector(".show-password-btn");

    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Скрыть";
    } else {
        input.type = "password";
        btn.textContent = "Показать";
    }
}
</script>

{% endblock %}
