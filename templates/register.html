{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<h2>Регистрация</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}
    <input name="first_name" placeholder="Имя" required>
    <input name="last_name" placeholder="Фамилия" required>
    <input name="email" type="email" placeholder="Email" required>

    <div style="margin-top:10px;">
        <input id="password" name="password" type="password" placeholder="Пароль" required>
        <label style="display:block; margin-top:5px; font-size:14px;">
            <input type="checkbox" onclick="togglePassword()"> Показать пароль
        </label>
    </div>

    <button style="margin-top:10px;">Создать аккаунт</button>
</form>

<p style="text-align:center; margin-top:10px;">
    Уже есть аккаунт? <a href="/login/">Войти</a>
</p>

<script>
function togglePassword() {
    const p = document.getElementById("password");
    p.type = p.type === "password" ? "text" : "password";
}
</script>
{% endblock %}
