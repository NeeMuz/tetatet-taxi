{% extends 'base.html' %}

{% block title %}Заказать такси{% endblock %}

{% block content %}
<h2 style="text-align:center;">Заказать такси</h2>

<p style="text-align:center;">
    Пользователь: {{ request.user.first_name }} {{ request.user.last_name }}
</p>

<form id="orderForm">
    <input id="from" placeholder="Откуда" required>
    <input id="to" placeholder="Куда" required>
    <input id="phone" placeholder="Номер телефона" required>
    <textarea id="comment" placeholder="Комментарий (необязательно)"></textarea>
    <button type="submit">Заказать</button>
</form>

<p id="result"></p>
<p id="status"></p>

<p style="text-align:center;">
    <a href="/logout/" class="logout-btn">Выйти</a>
</p>

<script>
const form = document.getElementById("orderForm");
const submitBtn = form.querySelector("button");
const resultEl = document.getElementById("result");
const statusEl = document.getElementById("status");

function disableSubmit() {
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.5";
    submitBtn.style.cursor = "not-allowed";
}

function enableSubmit() {
    submitBtn.disabled = false;
    submitBtn.style.opacity = "1";
    submitBtn.style.cursor = "pointer";
}

["from", "to", "phone", "comment"].forEach(id => {
    document.getElementById(id).addEventListener("input", enableSubmit);
});

form.onsubmit = async (e) => {
    e.preventDefault();

    disableSubmit();

    const data = {
        name: "{{ request.user.first_name }} {{ request.user.last_name }}",
        phone: document.getElementById("phone").value,
        from_address: document.getElementById("from").value,
        to_address: document.getElementById("to").value,
        comment: document.getElementById("comment").value
    };

    const response = await fetch("/api/taxi/orders/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    if (response.ok) {
        resultEl.innerText = "Заказ отправлен!";
        statusEl.innerText = "Статус заказа: Новый";
    } else {
        resultEl.innerText = "Ошибка!";
        statusEl.innerText = "";
    }
};

let wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
let socket = new WebSocket(wsScheme + "://" + window.location.host + "/ws/orders/");

socket.onmessage = function(event) {
    try {
        const data = JSON.parse(event.data);
        if (data && data.status) {
            statusEl.innerText = "Статус заказа: " + data.status;
        }
    } catch (e) {
        console.log("WS parse error", e);
    }
};
</script>
{% endblock %}
