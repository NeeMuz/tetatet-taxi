{% extends 'base.html' %}
{% load site_i18n %}

{% block title %}{% t "auth.forgot.title" %} — Tetatet{% endblock %}

{% block layout %}
<div class="page-profile">
    <div class="profile-card" style="max-width:420px;margin:0 auto;">
        <h1>{% t "auth.forgot.title" %}</h1>
        <p class="profile-sub">{% t "auth.forgot.sub" %}</p>

        <form method="POST" action="/password_reset/">
            {% csrf_token %}
            <div class="field">
                <label class="field-label">{% t "common.email" %}</label>
                <input class="field-input" type="email" name="email" placeholder="{% t 'auth.forgot.email_placeholder' %}" required>
            </div>
            <button type="submit" class="btn btn-accent btn-block">{% t "auth.forgot.submit" %}</button>
        </form>

        <p class="auth-footer" style="margin-top:16px;text-align:center;">
            <a href="{% url 'login' %}">{% t "auth.forgot.back_login" %}</a>
        </p>
    </div>
</div>
{% endblock %}
