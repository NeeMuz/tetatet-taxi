{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<h2 style="text-align:center; margin-bottom: 25px;">Вход</h2>

{% if error %}
<p class="error" style="text-align:center; margin-bottom: 15px;">{{ error }}</p>
{% endif %}

<form method="POST" style="display:flex; flex-direction:column; gap:15px;">
    {% csrf_token %}

    <input name="email" type="email" placeholder="Email" required>

    <input id="password" name="password" type="password" placeholder="Пароль" required>

    <button type="button" class="show-password-btn" onclick="togglePassword()">Показать пароль</button>

    <button class="login-btn">Войти</button>
</form>

<p style="text-align:center; margin-top:15px;">
    <a href="/forgot-password/">Забыли пароль?</a>
</p>

<p style="text-align:center; margin-top:10px;">
    Нет аккаунта? <a href="/register/">Зарегистрироваться</a>
</p>

<style>
input {
    padding: 12px;
    border-radius: 6px;
    border: none;
    font-size: 15px;
}

.show-password-btn {
    padding: 10px;
    background: #6c63ff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.show-password-btn:hover {
    background: #584fe0;
}

.login-btn {
    padding: 12px;
    border-radius: 6px;
    border: none;
    background: #f1c40f;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.login-btn:hover {
    background: #d4ac0d;
}
</style>

<script>
function togglePassword() {
    const input = document.getElementById("password");
    const btn = document.querySelector(".show-password-btn");

    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Скрыть пароль";
    } else {
        input.type = "password";
        btn.textContent = "Показать пароль";
    }
}
</script>

{% endblock %}
