{% extends 'base.html' %}

{% block title %}Заказать такси{% endblock %}

{% block content %}
<h2 style="text-align:center;">Заказать такси</h2>

<p style="text-align:center;">
    Пользователь: {{ request.user.first_name }} {{ request.user.last_name }}
</p>

<form id="orderForm">
    <input id="from" placeholder="Откуда" required>
    <input id="to" placeholder="Куда" required>
    <input id="phone" placeholder="Номер телефона" required>
    <textarea id="comment" placeholder="Комментарий (необязательно)"></textarea>
    <button type="submit">Заказать</button>
</form>

<div id="orderInfo" style="
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#1e1e1e;
    color:white;
    border:1px solid #444;
">
    <h3 style="margin-top:0;">Информация о заказе</h3>

    <p><b>ID заказа:</b> <span id="orderId"></span></p>
    <p><b>Статус:</b> <span id="orderStatus"></span></p>
    <p><b>Создан:</b> <span id="orderTime"></span></p>
</div>

<p style="text-align:center; margin-top:20px;">
    <a href="/logout/" class="logout-btn">Выйти</a>
</p>

<script>
const form = document.getElementById("orderForm");
const submitBtn = form.querySelector("button");

const orderInfo = document.getElementById("orderInfo");
const orderIdEl = document.getElementById("orderId");
const orderStatusEl = document.getElementById("orderStatus");
const orderTimeEl = document.getElementById("orderTime");

const statusMap = {
    "new": "Новый",
    "accepted": "Принят",
    "on_way": "В пути",
    "done": "Завершён"
};

function disableSubmit() {
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.5";
    submitBtn.style.cursor = "not-allowed";
}

function enableSubmit() {
    submitBtn.disabled = false;
    submitBtn.style.opacity = "1";
    submitBtn.style.cursor = "pointer";
}

["from", "to", "phone", "comment"].forEach(id => {
    document.getElementById(id).addEventListener("input", enableSubmit);
});

form.onsubmit = async (e) => {
    e.preventDefault();
    disableSubmit();

    const data = {
        name: "{{ request.user.first_name }} {{ request.user.last_name }}",
        phone: document.getElementById("phone").value,
        from_address: document.getElementById("from").value,
        to_address: document.getElementById("to").value,
        comment: document.getElementById("comment").value
    };

    const response = await fetch("/api/taxi/orders/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    if (response.ok) {
        const order = await response.json();
        localStorage.setItem("last_order_id", order.id);
        showOrder(order);
    } else {
        alert("Ошибка при создании заказа");
        enableSubmit();
    }
};

function showOrder(order) {
    orderIdEl.innerText = order.id;
    orderStatusEl.innerText = statusMap[order.status] || order.status;
    orderTimeEl.innerText = new Date(order.created_at).toLocaleString();
    orderInfo.style.display = "block";
}

async function loadLastOrder() {
    const id = localStorage.getItem("last_order_id");
    if (!id) return;

    const response = await fetch("/api/taxi/orders/");
    const orders = await response.json();

    const order = orders.find(o => o.id == id);
    if (order) showOrder(order);
}

loadLastOrder();

let wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
let socket = new WebSocket(wsScheme + "://" + window.location.host + "/ws/orders/");

socket.onmessage = function(event) {
    try {
        const data = JSON.parse(event.data);
        const lastId = localStorage.getItem("last_order_id");

        if (data.id == lastId) {
            orderStatusEl.innerText = statusMap[data.status] || data.status;
        }
    } catch (e) {
        console.log("WS parse error", e);
    }
};
</script>

{% endblock %}
